<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تعلم الحروف العربية</title>
<meta name="theme-color" content="#F16232">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #ffffff; color: #111111;
    min-height: 100vh;
    transition: background .6s ease;
  }
  @media (prefers-color-scheme: dark) { body { background: #141414; color: #f0f0f0; } }
  button { font: inherit; }
  .wrap { width: 100%; max-width: 460px; margin: 0 auto; padding: 16px 12px 40px; position: relative; z-index: 1; }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
  .title { font-size: 17px; font-weight: 600; }
  .score { font-size: 13px; color: #777; white-space: nowrap; }
  .pill { background: color-mix(in srgb, var(--c,#F16232) 9%, transparent); border-radius: 16px; padding: 2px 10px; font-size: 12px; }
  .chip { font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 20px; color: #fff; background: var(--c, #F16232); transition: background .4s ease; }
  @media (prefers-color-scheme: dark) { .score { color: #aaa; } }
  .bar { height: 5px; border-radius: 5px; background: color-mix(in srgb, var(--c,#F16232) 12%, transparent); overflow: hidden; margin-bottom: 12px; }
  @media (prefers-color-scheme: dark) { .bar { background: #333; } }
  .bar-fill { height: 100%; width: 0%; transition: width .3s ease; background: linear-gradient(90deg, var(--c1,#F16232), var(--c2,#f7a76c)); background-size: 200% 100%; animation: barFlow 3s linear infinite; }
  @keyframes barFlow { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }
  .letter-card {
    width: min(62vw, 250px); margin: 10px auto 6px; padding: 34px 0 28px;
    border-radius: 30px; text-align: center;
    background: color-mix(in srgb, var(--c,#F16232) 9%, transparent);
    border: 1.5px solid color-mix(in srgb, var(--c,#F16232) 32%, transparent);
    box-shadow: 0 10px 34px color-mix(in srgb, var(--c,#F16232) 16%, transparent), inset 0 1px 0 color-mix(in srgb, #ffffff 25%, transparent);
    animation: float 3.5s ease-in-out infinite;
  }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  .letter {
    font-size: 104px; font-weight: 700; line-height: 1.15; color: var(--c,#F16232);
    text-shadow: 0 6px 24px color-mix(in srgb, var(--c,#F16232) 32%, transparent);
  }
  .prompt { font-size: 14px; color: #999; margin-top: 6px; }
  @media (prefers-color-scheme: dark) { .prompt { color: #aaa; } }
  .mic-zone { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 22px 0 10px; }
  .mic-btn { position: relative; width: 88px; height: 88px; border-radius: 50%; border: none; background: linear-gradient(145deg, color-mix(in srgb, var(--c,#F16232) 88%, #fff), var(--c,#F16232)); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 22px color-mix(in srgb, var(--c,#F16232) 50%, transparent); transition: transform .12s ease, background .4s ease; }
  .mic-btn::before { content: ''; position: absolute; inset: -7px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--c,#F16232) 45%, transparent); animation: ringPulse 2.2s ease-out infinite; }
  @keyframes ringPulse { 0% { transform: scale(.92); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }
  .mic-btn:active { transform: scale(.93); }
  .mic-btn.listening { animation: micPulse 1.2s ease infinite; }
  .mic-btn.playing { animation: pulse 1s ease infinite; }
  @keyframes micPulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c,#F16232) 55%, transparent); } 50% { box-shadow: 0 0 0 18px transparent; } }
  .mic-hint { font-size: 13px; color: #999; text-align: center; max-width: 320px; line-height: 20px; }
  .result-line { text-align: center; min-height: 26px; font-size: 16px; font-weight: 600; padding: 4px 0; }
  .result-line.ok { color: #2e9e5b; }
  .result-line.bad { color: #d64545; }
  .heard { font-size: 13px; color: #999; text-align: center; min-height: 18px; }
  .skip-row { text-align: center; margin-top: 16px; }
  .btn { padding: 12px 36px; border-radius: 12px; border: none; background: linear-gradient(135deg,#F16232,#f28a55); color: #fff; cursor: pointer; font-size: 17px; font-weight: 600; box-shadow: 0 3px 12px rgba(241,98,50,.35); transition: transform .1s ease; }
  .btn:active { transform: scale(.96); }
  .btn.ghost { background: transparent; color: inherit; border: 1px solid #ddd; box-shadow: none; }
  @media (prefers-color-scheme: dark) { .btn.ghost { border-color: #444; } }
  .btn.small { font-size: 13px; padding: 8px 22px; font-weight: 500; border-radius: 20px; }
  .start { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 40px 0 20px; }
  .start .logo { font-size: 68px; font-weight: 700; background: linear-gradient(90deg,#F16232,#f7a76c,#F16232); background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent; animation: flow 4s linear infinite; }
  @keyframes flow { to { background-position: 200% center; } }
  .start p { font-size: 16px; color: #777; text-align: center; line-height: 26px; margin: 0; }
  @media (prefers-color-scheme: dark) { .start p { color: #aaa; } }
  .warn { background: rgba(214,69,69,.1); border: 1px solid rgba(214,69,69,.4); color: #d64545; font-size: 13px; border-radius: 10px; padding: 10px 14px; text-align: center; line-height: 20px; max-width: 340px; }
  .info { background: rgba(74,144,217,.1); border: 1px solid rgba(74,144,217,.4); color: #4a90d9; font-size: 13px; border-radius: 10px; padding: 10px 14px; text-align: center; line-height: 20px; max-width: 340px; }
  .mode-btns { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; }
  .mode-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 12px 16px; border-radius: 14px; cursor: pointer; color: inherit;
    background: color-mix(in srgb, var(--mc,#F16232) 7%, transparent);
    border: 1.5px solid color-mix(in srgb, var(--mc,#F16232) 30%, transparent);
    transition: transform .12s ease, border-color .2s ease;
    animation: rise .5s ease backwards;
  }
  .mode-btn:nth-child(2) { animation-delay: .12s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .mode-btn:not(:disabled):active { transform: scale(.96); border-color: var(--mc); }
  .mode-btn:disabled { opacity: .5; cursor: default; }
  .mode-icon {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center; color: #fff;
    background: linear-gradient(135deg, var(--mc,#F16232), color-mix(in srgb, var(--mc,#F16232) 65%, #fff));
  }
  .mode-btn .m-name { font-size: 16px; font-weight: 700; }
  .streak { text-align: center; margin-top: 12px; font-size: 13px; color: #999; }
  .final { text-align: center; padding: 24px 0; }
  .final .big { font-size: 46px; font-weight: 700; margin: 6px 0 2px; font-variant-numeric: tabular-nums; background: linear-gradient(90deg,#F16232,#f7a76c); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .final p { color: #777; font-size: 15px; line-height: 24px; }
  @media (prefers-color-scheme: dark) { .final p { color: #aaa; } }
  .stats { display: flex; justify-content: center; gap: 26px; margin: 16px 0; }
  .stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 12px; color: #999; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt {
    padding: 22px 8px; border-radius: 20px; cursor: pointer; color: inherit;
    font-size: 38px; font-weight: 600; line-height: 1.4;
    background: color-mix(in srgb, var(--oc,#999) 7%, transparent);
    border: 1.5px solid color-mix(in srgb, var(--oc,#999) 32%, transparent);
    box-shadow: 0 2px 10px color-mix(in srgb, var(--oc,#999) 8%, transparent), inset 0 1px 0 color-mix(in srgb, #ffffff 20%, transparent);
    transition: all .18s ease;
  }
  .opt:not(:disabled):active { transform: scale(.96); background: color-mix(in srgb, var(--oc,#999) 17%, transparent); border-color: var(--oc,#999); box-shadow: 0 6px 18px color-mix(in srgb, var(--oc,#999) 22%, transparent); }
  .opt:disabled { cursor: default; }
  .opt.correct { border-color: var(--oc); background: color-mix(in srgb, var(--oc) 22%, transparent); font-weight: 700; }
  .opt.wrong { border-color: #d64545 !important; color: #d64545; background: rgba(214,69,69,.12) !important; }
  .listen-zone { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 10px 0 22px; }
  .listen-btn { display: flex; align-items: center; gap: 8px; padding: 14px 32px; border-radius: 12px; border: none; background: var(--c, #F16232); color: #fff; cursor: pointer; font-size: 17px; font-weight: 600; box-shadow: 0 3px 12px color-mix(in srgb, var(--c,#F16232) 40%, transparent); transition: background .4s ease, transform .1s ease; }
  .listen-btn:active { transform: scale(.96); }
  .listen-btn.playing { animation: pulse 1s ease infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  .back-fab {
    position: fixed; bottom: 18px; left: 16px; z-index: 40;
    width: 48px; height: 48px; border-radius: 50%; border: none;
    background: var(--c, #F16232); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px color-mix(in srgb, var(--c,#F16232) 45%, transparent);
    transition: transform .12s ease, background .4s ease;
  }
  .back-fab:active { transform: scale(.9); }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  .glow { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .18; pointer-events: none; z-index: 0; transition: background .8s ease; }
</style>
</head>

<div class="glow" id="glow" style="width:60vw;height:60vw;top:-20vw;left:-15vw;background:#F16232"></div>

<div class="wrap" id="app"></div>

    };
    function hueOf(ch){ return Math.round((letters.indexOf(ch) * 360) / 28); }

    function norm(s){
      return s.replace(/[\u064B-\u0652\u0670]/g,'')

              .replace(/ة/g,'ه')
              .replace(/\s+/g,'').trim();
    }
    function accepts(ch, transcript){
      let t = norm(transcript);
      if (!t) return false;
      t = t.replace(/^حرف/, '');           // إذا قال "حرف باء" نحذف كلمة حرف
      if (!t) return false;
      // نطق الحرف مباشرة: أول حرف من الكلام يطابق الحرف المطلوب
      if (t[0] === ch) return true;
      // أو اسم الحرف كاملاً / جزءاً منه
      return names[ch].some(n => {
        const nn = norm(n);
        return t === nn || t.includes(nn) || nn.includes(t);
      });

    const cv = document.getElementById('confetti');
    const cx = cv.getContext('2d');
    let parts = [], rafOn = false;
    function sizeCanvas(){ cv.width = innerWidth; cv.height = innerHeight; }
    addEventListener('resize', sizeCanvas); sizeCanvas();
    function confetti(colors){
      for (let i=0;i<120;i++){
        parts.push({ x: innerWidth/2 + (Math.random()-.5)*200, y: innerHeight*.35,
          vx:(Math.random()-.5)*12, vy:-Math.random()*12-4, g:.28,
          s:Math.random()*7+4, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3,
          c:colors[Math.floor(Math.random()*colors.length)], life:120+Math.random()*40 });
      }
      if (!rafOn){ rafOn = true; tick(); }
    }
    function tick(){
      cx.clearRect(0,0,cv.width,cv.height);
      parts = parts.filter(p => p.life > 0 && p.y < cv.height + 20);
      parts.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += p.g; p.r += p.vr; p.life--;
        cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r);
        cx.globalAlpha = Math.min(1, p.life/40);
        cx.fillStyle = p.c; cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);
        cx.restore();
      });
      if (parts.length){ requestAnimationFrame(tick); } else { rafOn = false; cx.clearRect(0,0,cv.width,cv.height); }

    function setTheme(ch){
      const h = hueOf(ch);
      document.documentElement.style.setProperty('--c', `hsl(${h} 75% 55%)`);

      document.documentElement.style.setProperty('--c2', `hsl(${(h+40)%360} 80% 65%)`);

      document.getElementById('glow2').style.background = `hsl(${(h+40)%360} 80% 65%)`;

            ${speakBtn}
            <button class="mode-btn" style="--mc:#4a90d9" onclick="start('listen')">
              <span class="mode-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M7.76253 3.10547C8.25778 3.10552 8.74424 3.23849 9.17073 3.49023L19.533 9.60742C20.8536 10.3869 21.2923 12.0901 20.5174 13.4121C20.2785 13.8195 19.9398 14.1604 19.533 14.4004L9.16975 20.5156C7.84722 21.2958 6.14596 20.8511 5.36995 19.5273C5.11962 19.1003 4.9872 18.6142 4.98714 18.1191V5.88672C4.98717 4.3537 6.22731 3.10547 7.76253 3.10547ZM6.78792 18.1191C6.78798 18.2945 6.83431 18.4664 6.92268 18.6172C7.19639 19.0841 7.79338 19.2377 8.25569 18.9648L18.618 12.8496C18.7607 12.7654 18.8803 12.6458 18.9647 12.502C19.2393 12.0334 19.082 11.4311 18.618 11.1572L8.25569 5.04102C8.10612 4.95273 7.93564 4.9063 7.76253 4.90625C7.22705 4.90625 6.78795 5.34218 6.78792 5.88672V18.1191Z" fill="currentColor"/></svg></span>
              <span class="m-name">اختبر استماعك</span>
            </button>
          </div>
        </div>`;
    }

    function start(m){
      mode = m;
      idx = 0; score = 0; streak = 0; bestStreak = 0; badges = [];
      renderQ();
    }

    function renderQ(){
      answered = false; listening = false;
      const ch = letters[Math.floor(Math.random() * letters.length)];
      window._ch = ch;
      setTheme(ch);
      const badgeHTML = badges.length ? badges.join(' · ') : 'شارات السلسلة: ٥ · ١٠ · ٢٥ · ٥٠ · ١٠٠';
      const footer = `
        <div class="skip-row">
          <button class="btn ghost small" onclick="skip()">تخطي</button>
          <button class="btn ghost small" onclick="finish()" style="margin-right:8px">إنهاء</button>
        </div>
        <button class="back-fab" onclick="backToMenu()" aria-label="رجوع للقائمة">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        `;

      if (mode === 'speak') {
        app.innerHTML = headerHTML('اختبار النطق') + `
          <div class="letter-card">
            <div class="letter">${ch}</div>
            <div class="prompt">انطق هذا الحرف</div>
          </div>
          <div class="mic-zone">
            <button class="mic-btn" id="micBtn" onclick="toggleListen()">${micSVG}</button>
            <span class="mic-hint" id="micHint">اضغط وانطق</span>
          </div>
          <div class="result-line" id="resLine"></div>
          <div class="heard" id="heard"></div>` + footer;
      } else {
        const wrong = shuffle(letters.filter(l => l !== ch)).slice(0, 3);
        const opts = shuffle([ch, ...wrong]);
        window._opts = opts;
        app.innerHTML = headerHTML('اختبار الاستماع') + `
          <div class="mic-zone">
            <button class="mic-btn" id="listenBtn" onclick="replayAudio()"><svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M7.76253 3.10547C8.25778 3.10552 8.74424 3.23849 9.17073 3.49023L19.533 9.60742C20.8536 10.3869 21.2923 12.0901 20.5174 13.4121C20.2785 13.8195 19.9398 14.1604 19.533 14.4004L9.16975 20.5156C7.84722 21.2958 6.14596 20.8511 5.36995 19.5273C5.11962 19.1003 4.9872 18.6142 4.98714 18.1191V5.88672C4.98717 4.3537 6.22731 3.10547 7.76253 3.10547ZM6.78792 18.1191C6.78798 18.2945 6.83431 18.4664 6.92268 18.6172C7.19639 19.0841 7.79338 19.2377 8.25569 18.9648L18.618 12.8496C18.7607 12.7654 18.8803 12.6458 18.9647 12.502C19.2393 12.0334 19.082 11.4311 18.618 11.1572L8.25569 5.04102C8.10612 4.95273 7.93564 4.9063 7.76253 4.90625C7.22705 4.90625 6.78795 5.34218 6.78792 5.88672V18.1191Z" fill="currentColor"/></svg></button>
            <span class="mic-hint">اضغط للاستماع ثم اختر الحرف</span>
          </div>
          <div class="opts">
            ${opts.map(o => `<button class="opt" style="--oc:${colorOf(o,70,50)}" onclick="pickOpt(this,'${o}')">${o}</button>`).join('')}
          </div>` + footer;
        setTimeout(() => playAudio(ch), 300);
      }
    }

    // ===== وضع الاستماع =====
    function playAudio(ch){
      try {
        if (player) { player.pause(); player.currentTime = 0; }
        player = new Audio(AUDIO[ch]);
        const btn = document.getElementById('listenBtn');
        if (btn) { btn.classList.add('playing'); player.onended = player.onerror = () => btn.classList.remove('playing'); }
        player.play().catch(()=>{ if (btn) btn.classList.remove('playing'); });
      } catch(e) {}
    }
    function replayAudio(){ playAudio(window._ch); }
    function pickOpt(btn, val){
      if (answered) return;
      answered = true;
      const ch = window._ch;
      app.querySelectorAll('.opt').forEach(b => {
        b.disabled = true;
        if (b.textContent === ch) b.classList.add('correct');
      });
      const ok = val === ch;
      if (ok) onCorrect(); else { streak = 0; btn.classList.add('wrong'); }
      setTimeout(next, ok ? 750 : 1400);
    }

    // ===== وضع النطق =====
    function toggleListen(){
      if (answered || listening) return;
      if (!SR) {
        document.getElementById('micHint').textContent = 'متصفحك لا يدعم التعرف على الصوت';
        return;
      }
      try {
        rec = new SR();
        rec.lang = 'ar-SA';
        rec.interimResults = false;
        rec.maxAlternatives = 3;
        const btn = document.getElementById('micBtn');
        const hint = document.getElementById('micHint');
        rec.onstart = () => { listening = true; btn.classList.add('listening'); hint.textContent = 'أستمع إليك... انطق الآن'; };
        rec.onend = () => { listening = false; btn.classList.remove('listening'); };
        rec.onerror = (e) => {
          listening = false; btn.classList.remove('listening');
          if (e.error === 'not-allowed') hint.textContent = 'اسمح بالوصول إلى الميكروفون: اضغط أيقونة القفل بجانب العنوان ثم فعّل الميكروفون';
          else if (e.error === 'network') hint.textContent = 'يلزم اتصال بالإنترنت للتعرف على الصوت';
          else hint.textContent = 'تعذر الاستماع (' + e.error + ') — حاول مجدداً';
        };
        rec.onresult = (e) => {
          if (answered) return;
          const alts = Array.from(e.results[0]).map(a => a.transcript);
          document.getElementById('heard').textContent = 'سمعت: «' + alts[0] + '»';
          const ok = alts.some(t => accepts(window._ch, t));
          answered = true;
          try { rec.stop(); } catch(err) {}
          const res = document.getElementById('resLine');
          btn.classList.remove('listening');
          if (ok) {
            res.textContent = 'أحسنت! إجابة صحيحة';
            res.className = 'result-line ok';
            hint.textContent = '';
            onCorrect();
          } else {
            res.textContent = 'الإجابة الصحيحة: ' + names[window._ch][0];
            res.className = 'result-line bad';
            hint.textContent = 'حاول في السؤال التالي';
            streak = 0;
          }
          setTimeout(next, ok ? 1300 : 2200);
        };
        rec.start();
      } catch(err) {
        document.getElementById('micHint').textContent = 'تعذر تشغيل الميكروفون في هذا المتصفح';
      }
    }

    function onCorrect(){
      score++; streak++; bestStreak = Math.max(bestStreak, streak);
      if ([5,10,25,50,100].includes(streak)) {
        badges.push(streak);
        const h = hueOf(window._ch);
        confetti([`hsl(${h} 80% 55%)`,`hsl(${(h+40)%360} 85% 60%)`,`hsl(${(h+80)%360} 80% 55%)`,'#ffffff']);
      }
    }

    function next(){ idx++; idx < TOTAL ? renderQ() : finish(); }

    function backToMenu(){
      try { rec && rec.stop(); } catch(e) {}
      try { if (player) { player.pause(); } } catch(e) {}
      document.body.style.background = '';
      renderStart();
    }

    function skip(){
      if (answered) return;
      answered = true;
      try { rec && rec.stop(); } catch(e) {}
      streak = 0;
      next();
    }

    function finish(){
      try { rec && rec.stop(); } catch(e) {}
      try { if (player) { player.pause(); } } catch(e) {}
      const done = Math.max(idx, 1);
      const pct = Math.round((score / done) * 100);
      let msg = pct >= 95 ? 'أسطوري!' :
                pct >= 85 ? 'ممتاز جداً' :
                pct >= 70 ? 'جيد جداً' :
                pct >= 50 ? 'جيد، واصل التدريب' : 'حاول مجدداً';
      document.body.style.background = '';
      confetti(['#F16232','#f7a76c','#2e9e5b','#4a90d9','#f2c14e']);
      app.innerHTML = `
        <div class="final">
          <p style="font-size:14px;color:#999">نتيجة ${mode === 'speak' ? 'اختبار النطق' : 'اختبار الاستماع'}</p>
          <div class="big">${score} / ${done}</div>
          <div class="stats">
            <div class="stat"><div class="v">${pct}٪</div><div class="k">الدقة</div></div>
            <div class="stat"><div class="v">${bestStreak}</div><div class="k">أطول سلسلة</div></div>
            <div class="stat"><div class="v">${done}</div><div class="k">الأسئلة</div></div>
          </div>
          <p>${msg}${badges.length ? ' · شارات: ' + badges.join('، ') : ''}</p>
          <button class="btn ghost" onclick="renderStart()" style="margin-top:10px">العودة للبداية</button>
        </div>`;
    }

    renderStart();
</script>
</body>
</html>
